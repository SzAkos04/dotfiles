# ============================================================
# PLUGINS (via TPM — Tmux Plugin Manager)
# Bootstrapped automatically by install.sh; to add/update plugins
# by hand, press prefix + I (capital i) to install, prefix + U to update.
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + Ctrl-s / Ctrl-r to save/restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-saves every 15 min, auto-restores on boot
set -g @plugin 'tmux-plugins/tmux-yank'        # 'y' in copy-mode also copies to the system clipboard

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'


# ============================================================
# SERVER & TERMINAL OPTIONS
# ============================================================
# True color support and terminal behavior alignment
set-option -g default-terminal "tmux-256color"
set-option -g focus-events on
set-option -ga terminal-overrides ",xterm-256color:Tc"

# No delay for escape key press (crucial for Vim/Neovim responsiveness)
set -s escape-time 0

# Enable mouse support for scrolling and pane resizing
set -g mouse on

# Allow applications to pass image buffers through tmux safely (e.g., yazi, fzf previews)
set -g allow-passthrough on


# ============================================================
# VI-MODE & COPY-PASTE SETTINGS
# ============================================================
# Use Vi keys in copy mode
setw -g mode-keys vi

# Vi-style selection and copy bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Paste buffer with prefix + P
bind P paste-buffer

# Double-click to select a word in copy-mode
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word

# Enter copy mode and scroll up to search immediately with prefix + /
bind / copy-mode \; send-keys -X search-backward ""

# Stay in copy mode after mouse drag selection (prevents snap-closing)
unbind -T copy-mode-vi MouseDragEnd1Pane


# ============================================================
# PANES & WINDOWS NAVIGATION
# ============================================================
# Split panes using v and s, automatically inheriting current working directory (CWD)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Smart pane switching with awareness of Vim splits.
# Seamlessly transitions between Tmux panes and Neovim splits using Ctrl + h/j/k/l.
# Requires 'christoomey/vim-tmux-navigator' plugin inside your Neovim config.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Restore native clear screen utility mapped to Ctrl+L since it's intercepted above
bind C-l send-keys 'C-l'

# Window navigation using prefix + comma / period
bind-key , previous-window
bind-key . next-window
unbind p
unbind n

# Fast config reload with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Configuration reloaded!"


# ============================================================
# NOISE & ACTIVITY BELLS (DEAFENED)
# ============================================================
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none


# ============================================================
# DESIGN & COLOR TWEAKS (Modern High-Contrast Palette)
# ============================================================
# Clock mode accent
setw -g clock-mode-colour "#cba6f7"

# Copy mode match selection styling
setw -g mode-style 'fg=#1e1e2e bg=#b4befe bold'

# Pane border dividers
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'

# Statusbar configuration layout
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# Left side banner: shows current active session identifier
set -g status-left '#[fg=#1e1e2e,bg=#b4befe,bold] ❐ #S #[bg=default,fg=default] '
set -g status-left-length 20

# Right side banner: prefix indicator, zoom flag, save status, clock
set -g status-right '#{?client_prefix,#[fg=#1e1e2e]#[bg=#f38ba8]#[bold] PREFIX #[default] ,}#{?window_zoomed_flag,#[fg=#1e1e2e]#[bg=#a6e3a1]#[bold] ZOOM #[default] ,}#[fg=#6c7086]%H:%M │ %Y-%m-%d '
set -g status-right-length 60

# Unfocused windows styling in statusbar
setw -g window-status-style 'fg=#6c7086 dim'
setw -g window-status-format ' #I #[fg=#a6adc8]#W #[fg=#6c7086]#F '

# Active window tab styling in statusbar
setw -g window-status-current-style 'fg=#1e1e2e bg=#cba6f7 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-bell-style 'fg=#f38ba8 bg=#1e1e2e bold'

# Message interface overlays (e.g., rename prompts, reload alerts)
set -g message-style 'fg=#cba6f7 bg=#313244 bold'


# ============================================================
# TPM (keep this line at the very bottom of the file)
# ============================================================
run "~/.tmux/plugins/tpm/tpm"
